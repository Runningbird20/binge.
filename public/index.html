<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="icon" href="%PUBLIC_URL%/favicon-32.png?v=2" type="image/png" sizes="32x32" />
    <link rel="icon" href="%PUBLIC_URL%/favicon-16.png?v=2" type="image/png" sizes="16x16" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="description" content="binge. — a media journal for tracking movies, TV shows, and books with friends." />

    <!--
      Preconnect to hosts the first paint depends on, so the DNS/TLS
      handshake happens in parallel with the app bundle downloading.
      image.tmdb.org and covers.openlibrary.org cover catalog image sources.
    -->
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="preconnect" href="https://covers.openlibrary.org" crossorigin />

    <!-- PWA / installability -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="binge." />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png?v=2" />

    <!-- Open Graph -->
    <meta property="og:title" content="binge." />
    <meta property="og:description" content="Track what you watch and read, build lists with friends, and discuss in the forum." />
    <meta property="og:type" content="website" />
    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages: https://github.com/rafgraph/spa-github-pages
      // Decodes redirect from 404.html into the correct browser history URL
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
    <title>binge.</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

</html>
