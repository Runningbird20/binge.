name: CI

# The one required check on every PR (make "Tests and build" required on main:
# Settings → Branches → main → Require status checks). Runs what the Vercel
# build would catch, and more:
#   - Jest (the whole web suite, once)
#   - the server tests (node --test)
#   - CI=true npm run build, which fails on any ESLint warning, like Vercel
# neon.yml only manages the Neon preview database branch.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Web tests (Jest)
        run: npx react-scripts test --watchAll=false

      - name: Server tests
        run: node --test server/data-access/*.test.js

      - name: Production build (warnings fail it, as on Vercel)
        run: npm run build
