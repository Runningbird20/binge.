name: Secret scan

# Runs gitleaks on the commits a PR adds (and on pushes to main): the default
# secret rules plus .gitleaks.toml, which also flags .env files, the
# database-split backups (user emails), Apple TV Secrets.xcconfig and
# keystores. If it fails, remove the file from the branch's history and
# rotate any key it contained — deleting it in a later commit isn't enough.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.28.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan the new commits
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          # A brand-new branch push has no "before" commit; scan just the head then.
          case "$RANGE" in 0000000000000000000000000000000000000000..*) RANGE="-1 ${RANGE#*..}";; esac
          gitleaks git --config .gitleaks.toml --log-opts="$RANGE" --redact --verbose --exit-code 1 .
