name: Sync TMDB Catalog

# Runs twice a week (Mon/Thu) on GitHub's servers — not on your machine.
# Each run downloads TMDB's bulk export files, finds new content,
# fetches full details, and upserts them directly into Supabase.
#
# First-time setup — add these secrets in your repo settings:
#   Settings → Secrets and variables → Actions → New repository secret
#
#   TMDB_API_KEY              https://www.themoviedb.org/settings/api
#   SUPABASE_URL              your Supabase project URL  (Settings → API)
#   SUPABASE_SERVICE_ROLE_KEY your service_role key      (Settings → API)

on:
  schedule:
    - cron: '0 0 * * 1,4'   # Monday and Thursday at 00:00 UTC
  workflow_dispatch:          # run manually from the Actions tab any time

jobs:
  sync:
    name: TMDB → Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 90       # hard stop — each run processes MAX_DETAILS_PER_RUN items

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install sync dependencies
        run: npm install
        working-directory: scripts

      - name: Run TMDB → Supabase sync (movies)
        run: node scripts/sync-tmdb-to-supabase.js
        env:
          TMDB_API_KEY:              ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TYPE:                      movie
          MAX_DETAILS_PER_RUN:       '5000'
          # MIN_POPULARITY: '0'      ← uncomment for every film ever (needs Supabase Pro)
          MIN_POPULARITY:            '1'

      - name: Run TMDB → Supabase sync (TV shows)
        run: node scripts/sync-tmdb-to-supabase.js
        env:
          TMDB_API_KEY:              ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TYPE:                      tv
          MAX_DETAILS_PER_RUN:       '5000'
          MIN_POPULARITY:            '1'
