name: Sync TMDB Catalog

# Runs twice a week (Mon/Thu) on GitHub's servers
# Each run downloads TMDB's bulk export files, finds new content,
# fetches full details, and upserts them into the Turso catalog.
#
# TMDB publishes each day's export around 08:00 UTC, so this is scheduled
# for 09:00 UTC to give it an hour of buffer (the script also falls back to
# prior days' exports if today's isn't up yet).
#
# First-time setup — add these secrets in your repo settings:
#   Settings → Secrets and variables → Actions → New repository secret
#
#   TMDB_API_KEY              v3 API key  — themoviedb.org/settings/api
#   TMDB_READ_TOKEN           v4 Read Access Token (the long eyJ… JWT on the same page)
#   TURSO_DATABASE_URL        libsql://<db>.turso.io (the media catalog)
#   TURSO_AUTH_TOKEN          turso db tokens create <db>

on:
  schedule:
    - cron: '0 9 * * 1,4'   # Monday and Thursday at 09:00 UTC
  workflow_dispatch:          # run manually from the Actions tab any time

env:
  TURSO_DATABASE_URL:         ${{ secrets.TURSO_DATABASE_URL }}
  TURSO_AUTH_TOKEN:           ${{ secrets.TURSO_AUTH_TOKEN }}
  NODE_PATH:                  ${{ github.workspace }}/scripts/node_modules

jobs:
  sync:
    name: TMDB → Turso
    runs-on: ubuntu-24.04
    timeout-minutes: 90       # hard stop — each run processes MAX_DETAILS_PER_RUN items

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install sync dependencies
        run: npm install
        working-directory: scripts

      - name: Run TMDB → Turso sync (movies)
        run: node scripts/sync-tmdb-to-turso.js
        env:
          TMDB_API_KEY:              ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_TOKEN:           ${{ secrets.TMDB_READ_TOKEN }}
          TYPE:                      movie
          MAX_DETAILS_PER_RUN:       '5000'
          # MIN_POPULARITY: '0'      ← uncomment for every film ever (requires sufficient database capacity)
          MIN_POPULARITY:            '1'

      - name: Run TMDB → Turso sync (TV shows)
        run: node scripts/sync-tmdb-to-turso.js
        env:
          TMDB_API_KEY:              ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_TOKEN:           ${{ secrets.TMDB_READ_TOKEN }}
          TYPE:                      tv
          MAX_DETAILS_PER_RUN:       '5000'
          MIN_POPULARITY:            '1'

      # Rows imported without popularity / vote_average / original_language /
      # age_rating: one TMDB lookup per row fills every empty column (nothing
      # already set is overwritten). The backlog was cleared on 2026-10-29, so
      # this only catches rows that arrive incomplete.
      - name: Backfill missing catalog fields
        run: node scripts/backfill-catalog-fields.js
        env:
          TMDB_API_KEY:              ${{ secrets.TMDB_API_KEY }}
          MAX_ROWS:                  '3000'      # per table; ~3000 lookups at ~15/s ≈ 3-4 min

      # Genre lists and row counts the app reads instead of scanning every row,
      # and clears the stored filter counts the sync made stale.
      - name: Refresh genre lists and counts
        if: always()
        run: node scripts/turso-catalog.js refresh
