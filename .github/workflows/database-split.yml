name: Database split (Neon media, Supabase accounts)

# Weekly check that the split still holds (docs/database-split.md):
#   Neon     keeps movies, tv_shows, books, their genre views, title_ratings,
#            episode_ratings_cache, subtitle_cache and catalog search.
#   Supabase keeps Auth and every user-owned table.
# It checks the deployed site reads media from Neon, then runs
# scripts/check-database-split.js (Neon holds only the catalog, Supabase serves
# none of it). A failed Monday run opens or updates an issue. Read-only.
#
# The one-time migration that removed the duplicates is done; its audit/apply
# jobs were removed on 2026-11-04 (see git history).
#
# Secrets: DATABASE_URL (Neon), SUPABASE_URL, SUPABASE_SECRET_KEY (or SUPABASE_SERVICE_ROLE_KEY)
# Variables (optional): BINGE_URL

on:
  schedule:
    - cron: '23 6 * * 1'   # Mondays
  workflow_dispatch:

concurrency:
  group: database-split
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Databases still split
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE_URL: ${{ vars.BINGE_URL || 'https://binge-26.vercel.app' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install script dependencies
        run: npm install
        working-directory: scripts

      - name: Deployed site serves media from Neon
        run: |
          # BINGE_URL may end in "/"; "//api" gets a 308 "Redirecting..." page.
          url="${SITE_URL%/}/api/neon-data/rest/movies?select=id&limit=1"
          body=$(curl -fsSL "$url")
          echo "$body" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let rows;try{rows=JSON.parse(s)}catch{console.error("Not JSON from "+process.argv[1]+": "+s.slice(0,200));process.exit(1)}if(!Array.isArray(rows)||!rows.length){console.error("Expected catalog rows from /api/neon-data");process.exit(1)}console.log("ok:",s)})' "$url"

      - name: Neon holds only the catalog; Supabase serves none of it
        run: node scripts/check-database-split.js

  report:
    name: Open an issue
    needs: check
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Weekly database-split check failed"
          body="Either the site couldn't read media from Neon, or a table is on the wrong side of the Neon (catalog) / Supabase (accounts) split. The failed step says which: $RUN_URL"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$title" --body "$body"
          fi
