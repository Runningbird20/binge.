name: Sync regional new releases

# Daily: adds new and upcoming titles in the listed original languages
# (Malayalam by default) and refreshes ones released in the last 120 days.
# The twice-weekly bulk sync (sync-tmdb.yml) misses small new releases because
# it works by popularity. Uses the same repo secrets as sync-tmdb.yml.

on:
  schedule:
    - cron: '30 10 * * *'   # every day at 10:30 UTC
  workflow_dispatch:

jobs:
  sync:
    name: TMDB discover → Neon
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install sync dependencies
        run: npm install
        working-directory: scripts

      - name: Run language sync
        run: node scripts/sync-language-to-neon.js
        env:
          DATABASE_URL:              ${{ secrets.DATABASE_URL }}
          NODE_PATH:                 ${{ github.workspace }}/scripts/node_modules
          TMDB_API_KEY:              ${{ secrets.TMDB_API_KEY }}
          LANGUAGES:                 ml
