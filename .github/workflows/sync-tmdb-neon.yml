name: Sync TMDB Catalog to Neon DB

# Runs twice a week (Mon/Thu) on GitHub's servers to sync new movies & TV shows
# directly into Neon Postgres.
#
# First-time setup — add these secrets in your repo settings:
#   Settings → Secrets and variables → Actions → New repository secret
#
#   DATABASE_URL              Neon Postgres connection string
#   TMDB_API_KEY              v3 API key  — themoviedb.org/settings/api
#   TMDB_READ_TOKEN           (Optional) v4 Read Access Token for bulk exports

on:
  schedule:
    - cron: '0 9 * * 1,4'   # Monday and Thursday at 09:00 UTC
  workflow_dispatch:        # run manually from Actions tab at any time
    inputs:
      type:
        description: 'Media type to sync'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'movie'
          - 'tv'
      max_items:
        description: 'Maximum items to enrich'
        required: false
        default: '5000'

jobs:
  sync:
    name: TMDB → Neon Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Run TMDB → Neon sync
        run: node scripts/sync-tmdb-to-neon.js
        env:
          DATABASE_URL:        ${{ secrets.DATABASE_URL }}
          TMDB_API_KEY:        ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_TOKEN:     ${{ secrets.TMDB_READ_TOKEN }}
          TYPE:                ${{ github.event.inputs.type || 'both' }}
          MAX_DETAILS_PER_RUN: ${{ github.event.inputs.max_items || '5000' }}
          MIN_POPULARITY:      '1'

